{% extends "base.html" %}
{% block title %}Create Missing Person Report{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Create Missing Person Report</h1>
    <p class="subtitle">Only authorized rescuers can create reports</p>
</div>
<form id="reportForm" onsubmit="createReport(event)">
    <div class="form-grid">
        <div class="form-group"><label>Full Name *</label><input type="text" id="fullName" required></div>
        <div class="form-group"><label>Age</label><input type="number" id="age" min="0" max="120"></div>
        <div class="form-group"><label>Gender</label>
            <select id="gender">
                <option value="unknown">Unknown</option><option value="male">Male</option>
                <option value="female">Female</option><option value="other">Other</option>
            </select>
        </div>
        <div class="form-group"><label>Height (cm)</label><input type="number" id="height" min="50" max="250"></div>
        <div class="form-group"><label>Weight (kg)</label><input type="number" id="weight" min="10" max="300"></div>
    </div>
    <div class="form-group"><label>Distinguishing Features</label><textarea id="features" rows="2"></textarea></div>
    <div class="form-group"><label>Clothing Description</label><textarea id="clothing" rows="2"></textarea></div>
    <div class="form-group"><label>Medical Conditions</label><textarea id="medical" rows="2"></textarea></div>
    <h3>Last Seen Information</h3>
    <div class="form-grid">
        <div class="form-group"><label>Date & Time *</label><input type="datetime-local" id="lastSeenTime" required></div>
        <div class="form-group"><label>Latitude</label><input type="number" id="lat" step="any" placeholder="e.g. 40.7128"></div>
        <div class="form-group"><label>Longitude</label><input type="number" id="lng" step="any" placeholder="e.g. -74.0060"></div>
    </div>
    <div class="form-group"><label>Address/Location *</label><input type="text" id="address" required></div>
    <h3>Contact Information</h3>
    <div class="form-grid">
        <div class="form-group"><label>Contact Phone *</label><input type="tel" id="contactPhone" required></div>
        <div class="form-group"><label>Contact Email</label><input type="email" id="contactEmail"></div>
    </div>
    <div class="form-group checkbox-group"><label><input type="checkbox" id="isUrgent"> MARK AS URGENT</label></div>
    <div class="form-group">
        <label>Photos (max 3)</label>
        <input type="file" id="photos" accept="image/*" multiple onchange="handlePhotos(this)">
        <div id="photoPreview" class="photo-preview"></div>
    </div>
    <button type="submit" class="btn btn-primary btn-large">Create Report</button>
</form>
{% endblock %}
{% block scripts %}
<script>
let photoData = [];
function handlePhotos(input) {
    photoData = [];
    document.getElementById('photoPreview').innerHTML = '';
    Array.from(input.files).slice(0, 3).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => { photoData.push(e.target.result); document.getElementById('photoPreview').innerHTML += `<img src="${e.target.result}" class="preview-img">`; };
        reader.readAsDataURL(file);
    });
}
async function createReport(e) {
    e.preventDefault();
    const token = localStorage.getItem('token');
    if (!token) { showToast('Please login as a rescuer', 'error'); return; }

    // Validate required fields
    const fullName = document.getElementById('fullName').value.trim();
    const lastSeenTime = document.getElementById('lastSeenTime').value;
    const address = document.getElementById('address').value.trim();
    const contactPhone = document.getElementById('contactPhone').value.trim();

    if (!fullName) { showToast('Full Name is required', 'error'); return; }
    if (!lastSeenTime) { showToast('Date & Time is required', 'error'); return; }
    if (!address) { showToast('Address is required', 'error'); return; }
    if (!contactPhone) { showToast('Contact Phone is required', 'error'); return; }

    const latVal = document.getElementById('lat').value;
    const lngVal = document.getElementById('lng').value;

    const data = {
        full_name: fullName,
        age: document.getElementById('age').value ? parseInt(document.getElementById('age').value) : null,
        gender: document.getElementById('gender').value,
        height_cm: document.getElementById('height').value ? parseInt(document.getElementById('height').value) : null,
        weight_kg: document.getElementById('weight').value ? parseInt(document.getElementById('weight').value) : null,
        distinguishing_features: document.getElementById('features').value || null,
        clothing_description: document.getElementById('clothing').value || null,
        medical_conditions: document.getElementById('medical').value || null,
        last_seen_location: {
            latitude: latVal ? parseFloat(latVal) : 0,
            longitude: lngVal ? parseFloat(lngVal) : 0,
            address: address,
            description: null
        },
        last_seen_datetime: new Date(lastSeenTime).toISOString(),
        contact_phone: contactPhone,
        contact_email: document.getElementById('contactEmail').value || null,
        is_urgent: document.getElementById('isUrgent').checked,
        photos: photoData
    };

    console.log('Sending report data:', JSON.stringify(data, null, 2));
    try {
        const res = await apiFetch('/api/reports/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
            body: JSON.stringify(data)
        });
        if (res.ok) {
            const report = await res.json();
            showToast('Report created!', 'success');
            setTimeout(() => window.location.href = `/reports/${report.id}`, 1000);
        } else {
            const err = await res.json();
            showToast(err.detail || 'Failed', 'error');
        }
    } catch (e) { console.error('Full error:', e); showToast(e.message || 'Network error', 'error'); }
}
document.addEventListener('DOMContentLoaded', () => {
    const user = getUserFromToken();
    if (!user || (user.role !== 'rescuer' && user.role !== 'admin')) {
        showToast('Access denied. Rescuer required.', 'error');
        setTimeout(() => window.location.href = '/', 2000);
    }
});
</script>
{% endblock %}

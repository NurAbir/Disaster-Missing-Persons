{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-container">
    <h1>Create Account</h1>
    <p class="subtitle">Anyone can create an account to submit tips</p>
    <form onsubmit="handleRegister(event)">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
            <label>Username *</label>
            <input type="text" id="username" required minlength="3">
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone">
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" id="password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-large">Create Account</button>
    </form>
    <p class="auth-link">Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
async function handleRegister(e) {
    e.preventDefault();
    const data = {
        full_name: document.getElementById('fullName').value,
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value || null,
        password: document.getElementById('password').value
    };
    try {
        const res = await apiFetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if (res.ok) {
            const result = await res.json();
            localStorage.setItem('token', result.access_token);
            showToast('Account created!', 'success');
            setTimeout(() => window.location.href = '/', 500);
        } else {
            const err = await res.json();
            showToast(err.detail || 'Registration failed', 'error');
        }
    } catch (e) { showToast(e.message || 'Network error', 'error'); console.error(e); }
}
</script>
{% endblock %}

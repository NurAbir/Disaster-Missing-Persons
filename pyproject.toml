[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disaster-missing-persons"
version = "1.0.0"
description = "Lightweight missing person reporting system for disaster scenarios"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Disaster Response Team"},
]
keywords = ["disaster", "missing-persons", "rescue", "fastapi", "mongodb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "motor>=3.3.2,<4.0.0",
    "pymongo>=4.6.1,<5.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib>=1.7.4,<2.0.0",
    "bcrypt>=3.2.0,<4.1.0",
    "python-multipart>=0.0.6,<1.0.0",
    "jinja2>=3.1.3,<4.0.0",
    "aiofiles>=23.2.1,<24.0.0",
    "pydantic>=2.5.3,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pillow>=10.2.0,<11.0.0",
    "email-validator>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
disaster-missing-persons = "disaster_missing_persons.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disaster_missing_persons"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
